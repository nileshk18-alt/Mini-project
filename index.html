<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern, responsive Simon Says memory game.">
    <title>Simon Says | Memory Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="game-shell">
        <section class="game-card">
            <header class="game-header">
                <div>
                    <p class="eyebrow">MEMORY CHALLENGE</p>
                    <h1>Simon Says</h1>
                    <p id="status" class="status">Press Start to begin</p>
                </div>

                <div class="score-board">
                    <div>
                        <span>LEVEL</span>
                        <strong id="level">0</strong>
                    </div>
                    <div>
                        <span>BEST</span>
                        <strong id="high-score">0</strong>
                    </div>
                </div>
            </header>

            <div class="game-info">
                <span id="message">Watch the pattern carefully 👀</span>
                <button id="start-btn" class="start-btn" type="button">Start Game</button>
            </div>

            <div class="btn-container" aria-label="Simon Says game buttons">
                <button class="btn red" id="red" data-color="red" aria-label="Red"></button>
                <button class="btn yellow" id="yellow" data-color="yellow" aria-label="Yellow"></button>
                <button class="btn green" id="green" data-color="green" aria-label="Green"></button>
                <button class="btn purple" id="purple" data-color="purple" aria-label="Purple"></button>
            </div>

            <footer class="game-footer">
                <span>⚡ Build your longest streak</span>
                <span>•</span>
                <span>Keyboard: 1 2 3 4</span>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
